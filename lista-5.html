        {
          id: 2,
          stem: "A linfa flui dos vasos linfáticos para dois canais principais, que a devolvem ao sangue na junção entre as veias jugular interna e subclávia. Acerca da drenagem linfática, marque a alternativa correta.",

            a: "O ducto linfático direito drena a linfa de todo o corpo abaixo do diafragma e do lado esquerdo da cabeça, do pescoço e do tórax.",

          explanation: "Alternativa C. O ducto torácico (cerca de 38 a 45 cm) se origina na cisterna do quilo, no abdome, e drena a linfa dos membros inferiores, do abdome, da pelve, do lado esquerdo da cabeça, do pescoço e do tórax e do membro superior esquerdo. Ele desemboca na junção entre as veias jugular interna e subclávia esquerdas. O ducto linfático direito (cerca de 1 cm) drena apenas o quadrante superior direito (lado direito da cabeça, do pescoço, do tórax e o membro superior direito)."

        {
          id: 3,
          stem: "Os linfonodos são estruturas ovais ou em forma de rim, encapsuladas, distribuídas ao longo dos vasos linfáticos. Há cerca de 600 deles no corpo, e estão agrupados em cadeias como as cervicais, axilares e inguinais. Em relação à anatomia e à fisiologia dos linfonodos, marque a alternativa incorreta.",

            a: "Localiza-se no mediastino superior, posteriormente ao esterno, e é o local de maturação dos linfócitos T.",
